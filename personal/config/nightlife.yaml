# What counts as a good night out, and where to look.
max_picks: 5
radius_miles: 30            # from Andover; Boston shows are fine if they're standouts
include_boston: true

event_types:                # in rough order of preference; edit to taste
  - live music (see music_taste below)
  - stand-up comedy
  - trivia night
  - brewery / taproom events
  - other (festivals, tastings, etc.)

# Live music: only shows that fit these styles. The reference bands describe the sound; they don't have to be playing.
# Tribute and cover bands in these styles count.
music_taste:
  - genre: classic rock
    like: [Led Zeppelin]
  - genre: grunge / 90s rock
    like: [Pearl Jam]
  - genre: 2000s rock
    like: [Muse, Panic! at the Disco]
  - genre: alternative rock
    like: []

# Optional: specific artists to always flag if they play within ~2 hours, even on a future date ("Heads up" line)
favorite_artists: []

# Places to check first. These are seeds, not limits; add your regulars.
seed_venues:
  - Tupelo Music Hall (Derry, NH)
  - Lowell Memorial Auditorium (Lowell, MA)
  - The Cabot (Beverly, MA)
  - Boston clubs: Paradise Rock Club, Brighton Music Hall, Roadrunner, The Sinclair, House of Blues

seed_towns: [Andover, North Andover, Lowell, Lawrence, Haverhill, Methuen, Reading, Newburyport, Salem NH]

avoid: [rap / hip-hop, country]   # genres or venues to skip
