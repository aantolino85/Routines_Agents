# Mountains to score each week.
# drive_hours = typical drive from Andover, MA, without traffic. Edit freely.
# elevation_m = upper-mountain elevation used for the forecast (summit snow, not base rain).

scoring:
  weekend_days: [Saturday, Sunday]   # add Friday if you take it off
  drive_penalty_after_hours: 2.0     # points start dropping after this many hours
  rain_threshold_in: 0.10            # liquid rain (not snow) per day that counts as a rain day
  warm_max_f: 40                     # daytime high above this = soft or slushy
  cold_min_f: -5                     # overnight low below this = brutal
  windy_mph: 30                      # max wind above this = lift-hold risk

mountains:
  - id: wachusett
    name: Wachusett
    state: MA
    drive_hours: 1.1
    latitude: 42.5031
    longitude: -71.8865
    elevation_m: 600
    snow_report_url: https://www.wachusett.com/the-mountain/conditions/

  - id: waterville
    name: Waterville Valley
    state: NH
    drive_hours: 1.8
    latitude: 43.9500
    longitude: -71.5270
    elevation_m: 1150
    snow_report_url: https://www.waterville.com/snow-report

